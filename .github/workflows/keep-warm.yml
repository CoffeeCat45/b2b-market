# Бесплатный инстанс Render засыпает через ~15 минут без запросов, а холодный старт длится до минуты.
# Пинг каждые 5 минут не даёт ему уснуть: 750 бесплатных инстанс-часов в месяц покрывают один
# постоянно живой сервис (730 ч). Публичный репозиторий: минуты Actions не тарифицируются.
name: Keep API warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        run: curl -sS -m 60 --retry 2 --retry-delay 5 https://b2b-market-api.onrender.com/api/health