# Netlify нужен только для одного: проксировать /api/* на Render.
# Браузеры в этой сети не проходят к *.workers.dev (замер 2026-11-14), а *.netlify.app отвечают
# за треть секунды, поэтому адрес API вида https://<сайт>.netlify.app/api работает без VPN.
#
# Прокси сделан редиректом со статусом 200: Netlify сам пересылает метод, query и тело запроса
# и отдаёт ответ сервера как есть, включая CORS-заголовки Render. Код для этого не нужен.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/*"
  to = "https://b2b-market-api.onrender.com/api/:splat"
  status = 200
  force = true
