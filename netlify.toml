# Netlify нужен только для одного: проксировать /api/* на Render.
# Браузеры в этой сети не проходят к *.workers.dev (замер 2026-11-14), а *.netlify.app отвечают
# за треть секунды, поэтому адрес API вида https://<сайт>.netlify.app/api работает без VPN.
#
# Само проксирование описано в public/_redirects: Netlify пересылает метод, query и тело запроса
# и отдаёт ответ сервера как есть, включая CORS-заголовки Render. Файл читается и при Git-деплое,
# и при ручной загрузке папки, поэтому правила намеренно не дублируются здесь.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Netlify раздаёт сайт из корня, а GitHub Pages — из подпапки /b2b-market/.
  VITE_BASE_PATH = "/"
  # Относительный адрес: страница ходит в /api своего же домена, который _redirects пересылает
  # на Render. Имя сайта знать заранее не нужно, а CORS не участвует — домен у запроса свой.
  VITE_API_BASE_URL = "/api"
